name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Smoke + live Sparkle check
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          CLEANMAC_LIVE: "1"
          CLEANMAC_EXPECT_SPARKLE: "iTerm,Rectangle"
        run: |
          brew install --cask iterm2 rectangle
          swift run CleanMacProSmoke
