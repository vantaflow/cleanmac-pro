name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Localization lint
        run: python3 Tools/check-localization.py
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble .app (localized resources)
        run: |
          swift build -c release
          ./Tools/build-app.sh
          ls "build/CleanMac Pro.app/Contents/Resources/CleanMacPro_CleanCore.bundle"
          for l in fr en es de; do test -f "build/CleanMac Pro.app/Contents/Resources/CleanMacPro_CleanCore.bundle/$l.lproj/Localizable.strings"; done
      - name: Smoke + live Sparkle check
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          CLEANMAC_LIVE: "1"
          CLEANMAC_EXPECT_SPARKLE: "iTerm,Rectangle"
        run: |
          brew install --cask iterm2 rectangle
          swift run CleanMacProSmoke
      - name: Live Sparkle check (outdated app)
        env:
          CLEANMAC_LIVE: "1"
          CLEANMAC_EXPECT_UPDATE: "Rectangle"
        run: |
          plist=/Applications/Rectangle.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string 1.0 "$plist"
          plutil -replace CFBundleVersion -string 1 "$plist"
          swift run CleanMacProSmoke
      - name: Live Sparkle install (really update Rectangle)
        env:
          CLEANMAC_LIVE: "1"
          CLEANMAC_INSTALL_UPDATE: "Rectangle"
        run: |
          swift run CleanMacProSmoke
          plutil -p /Applications/Rectangle.app/Contents/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"
          codesign --verify --deep --strict /Applications/Rectangle.app
